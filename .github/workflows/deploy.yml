name: Validate NOMADE

# Production is published manually through cPanel. CI must never reset the
# hosting checkout: data/menu.json and .htaccess contain live server changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nomade-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck -- --incremental false
      - run: node --test scripts/test-deploy-safety.cjs scripts/test-llms.cjs scripts/test-lint-dependencies.cjs scripts/test-lunch-checkout.cjs scripts/test-site-hardening.cjs
      - run: npm run build
